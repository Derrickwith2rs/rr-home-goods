<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RR Home Goods Inventory</title>
<style>
:root{--bg:#eef1f4;--panel:#fff;--fg:#171c22;--muted:#5d6873;--line:#cfd6dd;--accent:#0b5fa5;--bad:#b3362a}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:16px -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:1.15rem;margin:0 auto 0 0}
nav button{background:none;border:0;padding:8px 10px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;font-size:.95rem}
nav button.on{color:var(--fg);border-bottom-color:var(--accent)}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card h2,.card h3{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
label.wide{grid-column:1/-1}
input,select,textarea{font:inherit;font-size:16px;text-transform:none;letter-spacing:normal;color:var(--fg);padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%;min-width:0}
button{font:inherit;font-weight:600;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--fg);cursor:pointer}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--bad)}
button:disabled{opacity:.5}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.scan input{font-family:ui-monospace,Menlo,monospace;font-size:1.25rem;border:2px solid var(--accent)}
.hint{color:var(--muted);font-size:.9rem;margin:8px 0 0}
.sub{color:var(--muted);font-size:.8rem}
.mono{font-family:ui-monospace,Menlo,monospace}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:.72rem;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;white-space:nowrap}
.tablewrap{overflow-x:auto}
.stats{display:flex;flex-wrap:wrap;gap:18px}
.stats div{min-width:130px}
.stats b{display:block;font-size:1.2rem}
.tier{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:end}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:#fff;padding:10px 16px;border-radius:8px;z-index:20;max-width:90%}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.overlay .card{width:100%;max-width:380px}
</style>
</head>
<body>
<script>
function showDiag(t){
  let d=document.getElementById("diag");
  if(!d){d=document.createElement("pre");d.id="diag";d.style.cssText="position:fixed;top:0;left:0;right:0;margin:0;padding:10px;background:#fff3cd;color:#000;font:13px monospace;white-space:pre-wrap;z-index:99";document.body.appendChild(d);}
  d.textContent+=t+"
";
}
window.addEventListener("error",e=>{
  const who=(e.target&&e.target.src)?"Failed to load: "+e.target.src:(e.message||"Script error");
  showDiag(who+(e.lineno?" (line "+e.lineno+")":""));
},true);
window.addEventListener("unhandledrejection",e=>showDiag("Promise error: "+((e.reason&&e.reason.message)||e.reason)));
setTimeout(()=>{
  const g=id=>document.getElementById(id);
  if(g("app")&&g("app").hidden&&g("login").hidden&&g("setupMsg").hidden) showDiag("Still starting after 6 seconds. Sign-in screen never appeared.");
},6000);
</script>

<div id="setupMsg" class="overlay" hidden>
  <div class="card">
    <h2>Setup needed</h2>
    <p>The database settings have not been pasted into this file yet. Follow the setup steps, then reload the page.</p>
  </div>
</div>

<div id="login" class="overlay" hidden>
  <div class="card">
    <h2>Sign in</h2>
    <div style="display:flex;flex-direction:column;gap:12px">
      <label>Email<input id="loginEmail" type="email" autocomplete="username"></label>
      <label>Password<input id="loginPass" type="password" autocomplete="current-password"></label>
      <button class="pri" id="loginBtn">Sign in</button>
    </div>
  </div>
</div>

<div id="app" hidden>
  <header>
    <h1>RR Home Goods</h1>
    <nav id="tabs">
      <button data-view="scan" class="on">Scan &amp; Add</button>
      <button data-view="inv">Inventory</button>
      <button data-view="settings">Settings</button>
    </nav>
  </header>

  <main>
    <section id="v-scan">
      <div class="card scan">
        <label>Scan barcode (or type a tag like HG-00012, then Enter)
          <input id="scanBox" autocomplete="off" autocapitalize="characters">
        </label>
      </div>

      <div class="card" id="editor" hidden>
        <div class="row" style="justify-content:space-between">
          <h2 id="edTitle" style="margin:0;font-size:1.1rem"></h2>
          <span class="mono sub" id="edSku"></span>
        </div>
        <div class="grid" style="margin-top:12px">
          <label>Brand<input id="fBrand"></label>
          <label>Model<input id="fModel"></label>
          <label>Item type<input id="fType" placeholder="e.g. Coffee Maker"></label>
          <label>Key details<input id="fKeywords" placeholder="color, size, feature"></label>
          <label>Condition<select id="fCond"></select></label>
          <label>Category<select id="fCat"></select></label>
          <label>MSRP (retail) $<input id="fMsrp" type="number" step="0.01" min="0"></label>
          <label>Your price $<input id="fPrice" type="number" step="0.01" min="0"></label>
          <label>Quantity<input id="fQty" type="number" min="1" step="1" value="1"></label>
          <label>Pallet / lot<input id="fPallet"></label>
          <label>Bin<input id="fBin"></label>
          <label>Status<select id="fStatus"></select></label>
          <label>Sold for $<input id="fSold" type="number" step="0.01" min="0"></label>
          <label>UPC<input id="fUpc" class="mono"></label>
          <label class="wide">eBay title (made automatically, you can edit it) <span id="titleCount" class="sub"></span>
            <input id="fTitle" maxlength="80">
          </label>
          <label class="wide">Notes<textarea id="fNotes" rows="2"></textarea></label>
        </div>
        <p class="hint" id="priceHint"></p>
